# Сборка Windows-инсталлятора propgen (tools/build/build.py + installer/propgen.iss).
# Тег v* → GitHub Release с propgen-setup-<версия>.exe; ручной запуск (workflow_dispatch) — только артефакт.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия сборки (без релиза, только артефакт)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # python-build-standalone, колёса pip и vc_redist: ключ меняется вместе с зависимостями и версией сборщика
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: build-cache-${{ hashFiles('requirements.txt', 'tools/build/build.py') }}
          restore-keys: build-cache-

      - name: Версия
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME -replace '^v', '' }
          elseif ($env:INPUT_VERSION) { $v = $env:INPUT_VERSION -replace '^v', '' }
          else { $v = '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version: $v"

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          if (-not $iscc) { "${env:ProgramFiles(x86)}\Inno Setup 6" >> $env:GITHUB_PATH }

      - name: Сборка и smoke (build/app)
        run: python tools/build/build.py --version "${{ steps.ver.outputs.version }}"

      # тихая установка в чистую папку с /NOSTART → smoke установленного → обновление поверх запущенного
      # сервера → удаление; ловит ошибки самого инсталлятора, а не только сборки
      - name: Проверка инсталлятора
        run: python tools/build/build.py --install-test "dist/propgen-setup-${{ steps.ver.outputs.version }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: propgen-setup-${{ steps.ver.outputs.version }}
          path: |
            dist/propgen-setup-*.exe
            build/pip-freeze.txt
            build/app/installed.json
          if-no-files-found: error
          retention-days: 14

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/propgen-setup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
